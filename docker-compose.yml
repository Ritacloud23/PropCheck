services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propcheck
      POSTGRES_PASSWORD: propcheck
      POSTGRES_DB: propcheck
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propcheck -d propcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://propcheck:propcheck@db:5432/propcheck
      TEST_DATABASE_URL: postgresql+psycopg://propcheck:propcheck@db:5432/propcheck_test
      STORAGE_DIR: /data/storage
      API_PUBLIC_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
